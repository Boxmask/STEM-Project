<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zontik-1 | Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 데모 전용 CSS */
        body { background-color: #000; color: #0f0; font-family: monospace; }
        #demo-container { margin: 8rem auto 2rem; width: 90%; max-width: 1200px; border: 2px solid #333; }
        
        .demo-nav { display: flex; background: #222; padding: 10px; }
        .demo-nav button { background: #444; color: #fff; border: none; padding: 10px 20px; margin-right: 10px; cursor: pointer; font-family: 'Jost', sans-serif; text-transform: uppercase; }
        .demo-nav button.active { background: #8B7F57; }
        
        .view-screen { aspect-ratio: 16 / 9; padding: 20px; display: none; background: #111; position: relative; overflow: hidden; }
        .view-screen.active { display: block; }
        
        /* 카메라 화면 */
        #camera-view {
            background-image: url('unnamed.jpg');
            background-size: cover;
            background-position: center;
            cursor: pointer; 
        }

        /* -----------------------------------------------------------
           [수정 부분] IR 모드 CSS 필터 및 타겟 라벨 가독성 개선
           ----------------------------------------------------------- */
        /* 1. IR 모드 필터 적용 */
        #camera-view.ir-mode {
            filter: invert(100%) grayscale(100%) contrast(150%);
        }

        /* 2. IR 모드일 때 타겟 라벨 텍스트 가독성 확보 (검은색으로 출력)
           부모의 invert(100%) 필터에 의해 흰색(white)이 검은색으로 반전되어 출력됩니다. */
        #camera-view.ir-mode .target-label {
            color: white; 
            background: rgba(255, 255, 255, 0.7); /* 배경 박스도 가독성을 위해 조정 */
        }
        /* ----------------------------------------------------------- */

        .target-box { position: absolute; border: 2px solid red; width: 50px; height: 50px; top: 40%; left: 30%; z-index: 5;}
        
        /* 기본 상태 타겟 라벨 (Optical 모드) */
        .target-label {
            color: red;
            background: rgba(0,0,0,0.7);
            font-size: 0.8rem;
            position: absolute;
            top: -20px;
            left: 0;
            white-space: nowrap;
            padding: 2px 4px;
            border-radius: 2px;
        }

        /* HUD 오버레이 전용 CSS */
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; color: #0f0; padding: 20px; box-sizing: border-box; z-index: 10; }
        .hud-mode { position: absolute; top: 15px; left: 15px; font-size: 1.2rem; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .hud-top-center { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); text-align: center; display: flex; flex-direction: column; gap: 5px; }
        .hud-status { font-size: 1rem; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .hud-time { font-size: 1.2rem; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .hud-azimuth { position: absolute; bottom: 15px; right: 15px; text-align: center; }
        .azimuth-indicator { width: 90px; height: 90px; border: 2px solid #0f0; border-radius: 50%; position: relative; margin-bottom: 5px; background: rgba(0, 20, 0, 0.5); }
        .hull-icon { width: 24px; height: 45px; border: 1.5px solid #0f0; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .turret-bar { width: 3px; height: 45px; background: #0f0; position: absolute; top: 50%; left: 50%; transform-origin: bottom center; transform: translate(-50%, -100%) rotate(0deg); transition: transform 0.3s ease-out; }
        .azimuth-text { font-size: 1.2rem; font-weight: bold; }

        /* 로그 화면 */
        #log-view { overflow-y: scroll; color: #0f0; }
        .log-entry { margin-bottom: 8px; border-bottom: 1px dashed #333; padding-bottom: 4px; }
        .log-time { color: #888; margin-right: 10px; }
        .log-alert { color: red; }
        .log-success { color: #0f0; }
    </style>
</head>
<body>
    <nav id="navbar" style="background-color: #2C2E25;">
        <div class="logo">ZONT</div>
        <ul class="nav-links">
            <li><a href="index.html">Back to Home</a></li>
        </ul>
    </nav>

    <div id="demo-container">
        <div class="demo-nav">
            <button id="btn-camera" class="active">Camera View</button>
            <button id="btn-log">Combat Log</button>
        </div>

        <div id="camera-view" class="view-screen active">
            <div class="hud-overlay">
                <div class="hud-mode">MODE: <span id="camera-mode-val">OPTICAL</span></div>
                
                <div class="hud-top-center">
                    <div class="hud-status" id="hud-status-val">OPTICAL SENSOR: ONLINE</div>
                    <div class="hud-time" id="hud-time-display">00:00:00</div>
                </div>

                <div class="hud-azimuth">
                    <div class="azimuth-indicator">
                        <div class="hull-icon"></div>
                        <div class="turret-bar" id="turret-bar"></div>
                    </div>
                    <div class="azimuth-text"><span id="azimuth-val">0</span>°</div>
                </div>
            </div>

            <div class="target-box" id="target-box">
                <div class="target-label" id="target-label">ID: ATGM (HOSTILE)</div>
            </div>
        </div>

        <div id="log-view" class="view-screen">
            <div>SYSTEM INITIALIZED...</div>
            <div id="log-content"></div>
        </div>
    </div>

    <script>
        // 1. 화면 전환 기능
        const btnCamera = document.getElementById('btn-camera');
        const btnLog = document.getElementById('btn-log');
        const viewCamera = document.getElementById('camera-view');
        const viewLog = document.getElementById('log-view');

        btnCamera.addEventListener('click', () => {
            btnCamera.classList.add('active'); btnLog.classList.remove('active');
            viewCamera.classList.add('active'); viewLog.classList.remove('active');
        });

        btnLog.addEventListener('click', () => {
            btnLog.classList.add('active'); btnCamera.classList.remove('active');
            viewLog.classList.add('active'); viewCamera.classList.remove('active');
        });

        // 2. HUD 실시간 시계 기능
        const timeDisplay = document.getElementById('hud-time-display');
        setInterval(() => {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeDisplay.innerText = `${hours}:${minutes}:${seconds}`;
        }, 1000);

        // 3. 카메라 모드 전환 (클릭 시 텍스트 상태도 같이 변경됨)
        const cameraModeVal = document.getElementById('camera-mode-val');
        const hudStatusVal = document.getElementById('hud-status-val');

        viewCamera.addEventListener('click', () => {
            if (cameraModeVal.innerText === 'OPTICAL') {
                cameraModeVal.innerText = 'IR';
                hudStatusVal.innerText = 'IR SENSOR: ONLINE';
                viewCamera.classList.add('ir-mode');
            } else {
                cameraModeVal.innerText = 'OPTICAL';
                hudStatusVal.innerText = 'OPTICAL SENSOR: ONLINE';
                viewCamera.classList.remove('ir-mode');
            }
        });

        // 4. 가상 로그 생성 및 포탑 각도 연동 기능
        const logContent = document.getElementById('log-content');
        const turretBar = document.getElementById('turret-bar');
        const azimuthVal = document.getElementById('azimuth-val');
        const threats = ['ATGM', 'RPG-7', 'Loitering Munition'];
        
        setInterval(() => {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0') + ":" + String(now.getSeconds()).padStart(2, '0');
            
            const randomThreat = threats[Math.floor(Math.random() * threats.length)];
            const isSuccess = Math.random() > 0.1; 
            const randomAzimuth = Math.floor(Math.random() * 360);
            const randomDistance = Math.floor(Math.random() * 800) + 100;

            turretBar.style.transform = `translate(-50%, -100%) rotate(${randomAzimuth}deg)`;
            azimuthVal.innerText = randomAzimuth;

            let logHtml = `<div class="log-entry">
                <span class="log-time">[${timeStr}]</span>
                <span class="log-alert">WARNING: INCOMING ${randomThreat} DETECTED.</span><br>
                <span>AZIMUTH: ${randomAzimuth}° | DISTANCE: ${randomDistance}m</span><br>
                <span>INTERCEPTOR DEPLOYED... </span>`;
            
            if (isSuccess) {
                logHtml += `<span class="log-success">THREAT NEUTRALIZED.</span>`;
            } else {
                logHtml += `<span class="log-alert">INTERCEPT FAILED. BRACE.</span>`;
            }
            logHtml += `</div>`;

            logContent.innerHTML = logHtml + logContent.innerHTML; 
        }, 3500);
    </script>
</body>
</html>
